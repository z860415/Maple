<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="楓星玩家開團、報名與戰利品分寶"><title>楓星公會 · 打王集合所</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="mark">楓</span><span>打王集合所<small>MAPLE GUILD</small></span></a><div id="account"></div></header>
<main><section class="page-top"><div><div class="eyebrow">GUILD RAID BOARD</div><h1>今晚，一起打王。</h1><p>開團、選時段、報名，打完一起分寶。</p></div><button id="newRaid" class="primary" hidden>＋ 開團</button></section>
<div id="notice" role="status" hidden></div>
<section id="welcome" class="welcome" hidden><div><span class="eyebrow">自由組隊</span><h2>用 Discord 登入，找到你的隊伍</h2><p>角色資料只需填一次。每場的可參加時間、不打的王，直接留在報名備註。</p><button id="login" class="discord">Discord 登入</button><button id="demo" hidden>本機測試登入</button><p id="setup" class="muted"></p></div><div class="steps"><div><b>01</b> 成員自由開團</div><div><b>02</b> 一鍵報名與候補</div><div><b>03</b> 出席名單接分寶</div></div></section>
<section id="workspace" hidden><nav class="filters"><button data-filter="open" class="active">招募中</button><button data-filter="mine">我的團</button><button data-filter="all">最近 100 團</button><button id="refresh" class="push">重新整理</button><button id="profileButton">我的角色</button></nav><div class="board"><section id="raidList" class="raid-list" aria-label="團隊列表"></section><section id="detail" class="detail" aria-label="團隊詳情"><div class="empty">選擇一個團，查看隊伍與報名資訊。</div></section></div></section>
<footer>楓星公會打王站 · 時間以台灣時區顯示 · 角色能力由成員自行填寫</footer></main>
<dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="關閉">✕</button></div><div id="modalBody"></div></dialog>
<script src="config.js"></script><script src="app.js"></script></body></html>
