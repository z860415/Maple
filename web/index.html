<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="瑪卡巴卡公會開團、報名與戰利品分寶"><title>瑪卡巴卡</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="calendar.css"><link rel="stylesheet" href="loot.css"><link rel="stylesheet" href="availability.css"><link rel="stylesheet" href="product.css"></head><body>
<header><a class="brand" href="./"><span class="mark">瑪</span><span>瑪卡巴卡<small>打王集合所</small></span></a><div id="account"></div></header>
<main><section class="page-top"><div><div class="eyebrow">GUILD RAID BOARD</div><h1>今晚，一起打王。</h1><p>開團、選時段、報名，打完一起分寶。</p></div><button id="newRaid" class="primary" hidden>＋ 開團</button></section>
<div id="notice" role="status" hidden></div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true" hidden><span id="toastMessage"></span><button id="dismissToast" type="button" aria-label="關閉通知">×</button></div>
<section id="welcome" class="welcome" hidden><div><span class="eyebrow">自由組隊</span><h2>用 Discord 登入，找到你的隊伍</h2><p>角色資料只需填一次。每場的可參加時間、不打的王，直接留在報名備註。</p><button id="login" class="discord">Discord 登入</button><button id="demo" hidden>本機測試登入</button><p id="setup" class="muted"></p></div><div class="steps"><div><b>01</b> 成員自由開團</div><div><b>02</b> 一鍵報名與候補</div><div><b>03</b> 出席名單接分寶</div></div></section>
<section id="workspace" hidden><section id="raidPage"><section id="personalOverview" aria-label="我的狀態"></section><nav class="filters"><button data-filter="open" class="active">招募中</button><button data-filter="mine">我的團</button><button data-filter="all">最近 10 團</button><button id="refresh" class="push">重新整理</button><button id="availabilityButton" hidden>空閒時間</button><button id="profileButton">我的角色</button><button id="templatesButton">常用範本</button><button id="historyButton">參團紀錄</button></nav><section id="archiveControls" hidden><form id="archiveSearch"><input id="archiveQuery" type="search" maxlength="100" placeholder="搜尋團名、項目、角色或 Discord 暱稱" aria-label="搜尋歷史團隊"><button type="submit">搜尋更多</button><button id="archiveReset" type="button">最近 10 團</button></form></section><section id="calendar" aria-label="招募月曆"></section><div class="board"><section class="day-raids"><div class="raid-list-heading"><h2 id="dayHeading"></h2><label id="mineFilters" hidden>狀態<select id="mineStatus"><option value="all">全部狀態</option><option value="running">開打中</option><option value="open">招募中</option><option value="done">已完成</option><option value="cancelled">已取消</option></select></label></div><section id="raidList" class="raid-list" aria-label="團隊列表"></section><button id="archiveMore" type="button" hidden>載入更多</button></section><section id="detail" class="detail" tabindex="-1" aria-label="團隊詳情"><div class="empty">選擇一個團，查看隊伍與報名資訊。</div></section></div></section><section id="availabilityPage" hidden></section></section>
<footer>瑪卡巴卡公會打王站 · 角色能力由成員自行填寫</footer></main>
<dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" aria-label="關閉">✕</button></div><div id="modalBody"></div></dialog>
<script src="config.js"></script><script src="app.js"></script><script src="availability.js"></script><script src="product.js"></script></body></html>
